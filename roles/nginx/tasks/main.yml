---
- name: Prevent service autostart
  copy:
    dest: /usr/sbin/policy-rc.d
    mode: "0755"
    content: |
      #!/bin/sh
      exit 101

- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Remove policy-rc.d
  file:
    path: /usr/sbin/policy-rc.d
    state: absent

- name: Deploy index page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: restart nginx

- name: Deploy nginx config
  template:
    src: default.conf.j2
    dest: /etc/nginx/sites-enabled/default
  notify: restart nginx

- name: Validate nginx config
  command: nginx -t
  changed_when: false

- name: Enable nginx
  service:
    name: nginx
    state: started
    enabled: true
