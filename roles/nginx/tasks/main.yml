---
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Deploy index page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: restart nginx

- name: Deploy nginx config
  template:
    src: default.conf.j2
    dest: /etc/nginx/sites-enabled/default
  notify: restart nginx

- name: Validate nginx config
  command: nginx -t
  changed_when: false

- name: Flush handlers
  meta: flush_handlers

- name: Ensure nginx enabled
  service:
    name: nginx
    state: started
    enabled: true
